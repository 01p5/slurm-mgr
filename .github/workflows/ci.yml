name: CI

# Run on every push to main and every PR. Two jobs in parallel:
#   - backend: pip install the three packages, pytest with coverage,
#     gate at 80% via the fail_under setting in pyproject.toml.
#   - frontend: npm ci + typecheck + vite build, so a broken TSX file
#     never lands on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + coverage gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the minimum we advertise in pyproject.toml.
        # Upper bound catches deprecations early.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install packages (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e packages/slurmlib \
            -e packages/slurm-dashboard \
            -e packages/slurm-mcp
          pip install pytest pytest-cov coverage

      - name: Run pytest with coverage (fail under 80%)
        run: |
          pytest \
            --cov=slurmlib --cov=slurm_dashboard --cov=slurm_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage XML (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/slurm-dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/slurm-dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build SPA
        run: npm run build
