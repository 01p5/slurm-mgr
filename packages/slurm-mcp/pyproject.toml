[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-mcp"
version = "0.1.0"
description = "MCP server (JSON-RPC 2.0 / 2024-11-05) exposing Slurm s* commands as tools. Wire into Olympus via MCPServerConfig."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "01p5" }]
dependencies = [
    "slurmlib",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
slurm-mcp = "slurm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
